<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>x-clean-share · channel test</title>
<style>
  body{background:#111;color:#eee;font:14px/1.6 system-ui;padding:24px}
  button{display:block;margin:8px 0;padding:8px 14px;font-size:14px;cursor:pointer}
  code{color:#8be9fd}
</style>
</head>
<body>
<h3>模拟 X 的几种「复制链接」实现</h3>
<p>被测链接：<code>https://x.com/ohayou792/status/2115688877797286011?a=aNdSpiG2CrX9dPqMVn0&amp;s=20</code></p>

<button id="b1">1. navigator.clipboard.writeText</button>
<button id="b2">2. navigator.clipboard.write(ClipboardItem)</button>
<button id="b3">3. execCommand + textarea（copy 事件挂在 document）</button>
<button id="b4">4. execCommand + textarea（copy 事件挂在 window 捕获阶段，最坏时序）</button>
<button id="b5">5. 复制不带参数的链接（不应被改动）</button>
<button id="b6">6. 复制非 X 站点链接（不应被改动）</button>
<button id="b7">7. 复制一大段带链接的正文（不应被改动）</button>
<button id="b8">8. 选中文本后 execCommand 原生复制（页面无 copy 处理器）</button>
<button id="b9">9. 点菜单「复制链接」（模拟 X：页面自己会写带参数的链接）</button>
<button id="b10">10. 点菜单「帖子分享途径…」（不应被接管）</button>

<article id="fake-tweet" style="border:1px solid #333;padding:8px;margin-top:12px;max-width:420px">
  <a href="/ohayou792/status/2115688877797286011">这条推文的链接</a>
  <div role="menu" style="margin-top:8px">
    <div role="menuitem" id="mi-copy" style="cursor:pointer;padding:4px">复制链接</div>
    <div role="menuitem" id="mi-share" style="cursor:pointer;padding:4px">帖子分享途径…</div>
  </div>
</article>

<script src="../x-clean-share.user.js"></script>
<script>
const DIRTY = 'https://x.com/ohayou792/status/2115688877797286011?a=aNdSpiG2CrX9dPqMVn0&s=20';

// 1
document.getElementById('b1').onclick = () => navigator.clipboard.writeText(DIRTY);

// 2
document.getElementById('b2').onclick = () => {
  const blob = new Blob([DIRTY], {type: 'text/plain'});
  const html = new Blob(['<a href="' + DIRTY + '">link</a>'], {type: 'text/html'});
  return navigator.clipboard.write([new ClipboardItem({'text/plain': blob, 'text/html': html})]);
};

// 3 老式：临时 textarea + execCommand，copy 事件在 document 上补数据
document.addEventListener('copy', (e) => {
  if (window.__copyStyle === 'document' || window.__copyStyle === 'window-capture') {
    e.clipboardData.setData('text/plain', DIRTY);
    e.preventDefault();
  }
});

function legacyCopy() {
  const ta = document.createElement('textarea');
  ta.value = 'placeholder';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
}
document.getElementById('b3').onclick = () => { window.__copyStyle = 'document'; legacyCopy(); };

// 4 最坏时序：页面的 copy 处理挂在 window 捕获阶段
window.addEventListener('copy', (e) => {
  if (window.__copyStyle === 'window-capture') {
    e.clipboardData.setData('text/plain', DIRTY);
    e.preventDefault();
  }
}, true);
document.getElementById('b4').onclick = () => { window.__copyStyle = 'window-capture'; legacyCopy(); };

// 5/6/7 不该被改的用例
document.getElementById('b5').onclick = () => navigator.clipboard.writeText('https://x.com/ohayou792/status/2115688877797286011');
document.getElementById('b6').onclick = () => navigator.clipboard.writeText('https://example.com/a/status/1?s=20');
document.getElementById('b7').onclick = () => navigator.clipboard.writeText('看看这条：' + DIRTY + ' 挺有意思的');

// 8 纯原生：选中 textarea 里的 URL，execCommand 复制，页面不干预
document.getElementById('b8').onclick = () => {
  window.__copyStyle = 'none';
  const ta = document.createElement('textarea');
  ta.value = DIRTY;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
};

// 9/10 模拟 X 的菜单项：页面自己的处理器会写入带参数的链接
document.getElementById('mi-copy').onclick = () => {
  window.__pageHandlerRan = 'copy';
  navigator.clipboard.writeText('https://x.com/ohayou792/status/2115688877797286011?s=99&t=xyz');
};
document.getElementById('mi-share').onclick = () => {
  window.__pageHandlerRan = 'share';
  navigator.clipboard.writeText('https://x.com/ohayou792/status/2115688877797286011?share=1');
};
document.getElementById('b9').onclick = () => document.getElementById('mi-copy').click();
document.getElementById('b10').onclick = () => document.getElementById('mi-share').click();
</script>
</body>
</html>
